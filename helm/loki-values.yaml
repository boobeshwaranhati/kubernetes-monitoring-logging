backend:
  replicas: 0
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /tmp/loki
    replication_factor: 1
  rulerConfig:
    wal:
      dir: /tmp/loki/ruler-wal
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
    type: filesystem
read:
  replicas: 0
singleBinary:
  containerSecurityContext:
    readOnlyRootFilesystem: false
  persistence:
    enabled: false
  replicas: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
write:
  replicas: 0
